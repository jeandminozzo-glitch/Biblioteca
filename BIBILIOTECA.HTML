<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="ESTILOS.CSS">
    <title>Biblioteca Comunitária</title>
</head>
<body>
<header>
  	<h1>Biblioteca Comunitária</h1>
</header>

<main>
    <h2>Empréstimo de livros</h2>
    <img src="biblioteca.imagem.png" alt="Melhores livros para serem lidos!">
    <p>Reserva seu livro favorito gratuitamente.</p>
</main>


<label for="email-user">Email de contato:</label>
<input type="email" id="email-user" required>

<label for="email-name">Nome completo:</label>
<input type="name" id="name" required>

<fieldset>
  <legend>Você gosta de ler?</legend>
  <input type="checkbox" id="op2" name="interesses" value="Sim">
  <label for="op-jogos">Sim</label><br>

  <input type="checkbox" id="op2" name="interesses" value="Não">
  <label for="op2">Não</label>
</fieldset>

<button type="submit">Faça seu cadastro</button>

</body>
</html>
